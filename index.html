<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barber Steve | VIP Card</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0b0b0b;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card-container {
      background: #141414;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .profile-img {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 2px solid #c5a059;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(197, 160, 89, 0.2);
    }
    h1 {
      font-size: 22px;
      letter-spacing: 2px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    p.subtitle {
      color: #c5a059;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.2s ease;
    }
    .btn-gold {
      background: linear-gradient(135deg, #c5a059 0%, #9e7d3b 100%);
      color: #000000;
    }
    .btn-dark {
      background: #1f1f1f;
      color: #ffffff;
      border: 1px solid #333333;
    }
    .footer-text {
      margin-top: 24px;
      font-size: 10px;
      color: #555555;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <img src="IMG_2406.jpeg" alt="Barber Steve" class="profile-img">

    <h1>BARBER STEVE</h1>
    <p class="subtitle">MASTER BARBER & STYLING</p>

    <a href="https://themoroccanbarber.booksy.com/a/" class="btn btn-gold" target="_blank">
      📅 BOOK APPOINTMENT
    </a>

    <a href="tel:+17028091423" class="btn btn-dark">
      📞 Call Now
    </a>

    <a href="https://wa.me/17028091423" class="btn btn-dark" target="_blank">
      💬 WhatsApp
    </a>

    <a href="https://instagram.com/habibi.barber.vegas" class="btn btn-dark" target="_blank">
      📷 Instagram (@habibi.barber.vegas)
    </a>

    <a href="https://maps.apple.com/p/o9mCQ~AfcV~dPTP" class="btn btn-dark" target="_blank">
      📍 Location / Directions
    </a>

    <div class="footer-text">
      TAP TO CONNECT · NFC VIP CARD
    </div>
  </div>

</body>
</html>
