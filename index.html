<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barber Steve | VIP Barbering</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #161616;
            --accent-gold: #c5a059;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --button-bg: #222224;
            --button-hover: #2c2c2e;
            --border-color: rgba(197, 160, 89, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .profile-card {
            width: 100%;
            max-width: 390px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 36px 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .barber-pole-icon {
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 12px;
        }

        .name {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 6px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .title {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 28px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .call-main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, #c5a059 0%, #9e7d3b 100%);
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(197, 160, 89, 0.25);
            transition: transform 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .call-main-btn:active {
            transform: scale(0.98);
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--button-bg);
            padding: 16px 20px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .link-card:active {
            background: var(--button-hover);
            transform: scale(0.99);
        }

        .link-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .link-info i {
            font-size: 1.3rem;
            width: 24px;
            color: var(--accent-gold);
        }

        .link-text {
            font-size: 0.95rem;
            font-weight: 500;
        }

        .arrow-icon {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .footer {
            margin-top: 32px;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="barber-pole-icon">
            <i class="fa-solid fa-scissors"></i>
        </div>

        <h1 class="name">Barber Steve</h1>
        <p class="title">Master Barber & Styling</p>

        <a href="tel:+17028091423" class="call-main-btn">
            <i class="fa-solid fa-phone"></i>
            Call Now
        </a>

        <div class="links-container">
            
            <a href="https://wa.me/17028091423" class="link-card" target="_blank">
                <div class="link-info">
                    <i class="fa-brands fa-whatsapp"></i>
                    <span class="link-text">WhatsApp</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="https://instagram.com/habibi.barber.vegas" class="link-card" target="_blank">
                <div class="link-info">
                    <i class="fa-brands fa-instagram"></i>
                    <span class="link-text">Instagram (@habibi.barber.vegas)</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

            <a href="sms:+17028091423" class="link-card">
                <div class="link-info">
                    <i class="fa-solid fa-comment-sms"></i>
                    <span class="link-text">Text Message (SMS)</span>
                </div>
                <i class="fa-solid fa-chevron-right arrow-icon"></i>
            </a>

        </div>

        <div class="footer">
            TAP TO CONNECT • NFC VIP CARD
        </div>
    </div>

</body>
</html>
